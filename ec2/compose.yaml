name: gv
services:
  db:
    image: postgres:15-alpine
    env_file: api.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  gv-api:
    image: ${REGISTRY}/gv-api:latest
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    env_file: api.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  gv-web:
    image: ${REGISTRY}/gv-web:latest
    depends_on:
      gv-api:
        condition: service_healthy
    env_file: web.env
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
