AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  home-lab-failover

  Scheduled watchdog that checks the home lab API health endpoint

Parameters:
  BackupHourlyDays:
    Type: Number 
    Default: 2 
    MinValue: 1 
    Description: Days gv-db/hourly/ objects are kept.
  BackupDailyDays:
    Type: Number
    Default: 30 
    MinValue: 1 
    Description: Days gv-db/daily/ objects are kept

Globals:
  Function:
    Timeout: 10

Resources:
  WatchdogFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: watchdog/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Environment:
        Variables:
          HOME_LAB_API_URL: https://gv-health.lab-ocp.com
          FAILOVER_INSTANCE_ID: !Ref FailoverInstance 
      Policies:
        - Version: '2012-10-17'
          Statement: 
            - Effect: Allow 
              Action: ssm:SendCommand 
              Resource: 
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
                - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${FailoverInstance}
            - Effect: Allow
              Action: ec2:DescribeInstances
              Resource: '*'
            - Effect: Allow
              Action:
                - ec2:StartInstances
                - ec2:StopInstances
              Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${FailoverInstance}
            - Effect: Allow
              Action:
                - ssm:GetCommandInvocation
                - ssm:ListCommandInvocations
              Resource: '*'
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/home-lab-failover
                - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/home-lab-failover/*
            - Effect: Allow
              Action: ssm:PutParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/home-lab-failover/state
      Events:
        Every5Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)
  BackupBucket:
    Type: AWS::S3::Bucket 
    DeletionPolicy: Retain 
    UpdateReplacePolicy: Retain 
    Properties:  
      LifecycleConfiguration:
        Rules:
          - Id: hourly 
            Status: Enabled
            Prefix: gv-db/hourly/
            ExpirationInDays: !Ref BackupHourlyDays
          - Id: daily 
            Status: Enabled
            Prefix: gv-db/daily/
            ExpirationInDays: !Ref BackupDailyDays

  BackupUploader:
    Type: AWS::IAM::User 
    Properties:
      Policies:
        - PolicyName: put-new-backups-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow 
                Action: s3:PutObject
                Resource: !Sub '${BackupBucket.Arn}/gv-db/*'
                Condition:
                  'Null':
                    's3:if-none-match': 'false'

  GvApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: gv-api
      ImageTagMutability: MUTABLE

  GvWebRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: gv-web
      ImageTagMutability: MUTABLE

  DeployUser:
    Type: AWS::IAM::User
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserName: gv-deploy
      Policies:
        - PolicyName: gv-ecr-push
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                  - ecr:ListImages
                  - ecr:BatchDeleteImage
                Resource:
                  - !GetAtt GvApiRepository.Arn
                  - !GetAtt GvWebRepository.Arn

  FailoverSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Failover instance, no inbound (SSM + cloudflared are outbound only)

  FailoverInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow 
            Principal:
              Service: ec2.amazonaws.com 
            Action: sts:AssumeRole 
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ecr-pull
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow 
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow 
                Action:
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                Resource:
                  - !GetAtt GvApiRepository.Arn 
                  - !GetAtt GvWebRepository.Arn 
        - PolicyName: backup-bucket-rw 
          PolicyDocument: 
            Version: '2012-10-17'
            Statement:
              - Effect: Allow 
                Action: s3:ListBucket 
                Resource: !GetAtt BackupBucket.Arn 
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${BackupBucket.Arn}/gv-db/*'
                  - !Sub '${BackupBucket.Arn}/ec2/*'
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub '${BackupBucket.Arn}/gv-db/hourly/*'
                  - !Sub '${BackupBucket.Arn}/gv-db/daily/*'
                Condition:
                  'Null':
                    's3:if-none-match': 'false'
        - PolicyName: read-parameters
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/home-lab-failover/ec2
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/home-lab-failover/ec2/*

  FailoverInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref FailoverInstanceRole

  FailoverInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.small
      ImageId: "{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}"
      SecurityGroupIds:
        - !Ref FailoverSecurityGroup
      IamInstanceProfile: !Ref FailoverInstanceProfile
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: gv-failover
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          cat > /etc/gv.env <<EOF
          AWS_REGION=${AWS::Region}
          BUCKET=${BackupBucket}
          REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          EOF
          aws s3 sync --region ${AWS::Region} s3://${BackupBucket}/ec2/ /opt/gv/
          bash /opt/gv/setup.sh

Outputs:
  WatchdogFunction:
    Description: "Watchdog Lambda Function ARN"
    Value: !GetAtt WatchdogFunction.Arn
  WatchdogFunctionIamRole:
    Description: "Implicit IAM Role created for Watchdog function"
    Value: !GetAtt WatchdogFunctionRole.Arn
  BackupBucketName:
    Description: "Bucket for gv-api's backups (BACKUP_S3_BUCKET)"
    Value: !Ref BackupBucket
  BackupUploaderName:
    Description: "IAM user whose access key goes in gv-api's .env"
    Value: !Ref BackupUploader
  GvApiRepositoryUri:
    Description: "ECR repository for gv-api images"
    Value: !GetAtt GvApiRepository.RepositoryUri
  GvWebRepositoryUri:
    Description: "ECR repository for gv-web images"
    Value: !GetAtt GvWebRepository.RepositoryUri
  FailoverInstanceId:
    Description: "Failover EC2 instance (start/stop, Session Manager)"
    Value: !Ref FailoverInstance
