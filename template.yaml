AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  home-lab-failover

  Scheduled watchdog that checks the home lab API health endpoint

Globals:
  Function:
    Timeout: 10

Resources:
  WatchdogFunction:
    Type: AWS::Serverless::Function 
    Properties:
      CodeUri: watchdog/
      Handler: app.lambda_handler
      Runtime: python3.14
      Architectures:
        - x86_64
      Environment:
        Variables:
          HOME_LAB_API_URL: https://gv-api.lab-ocp.com
      Events:
        Every5Min:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(5 minutes)

Outputs:
  WatchdogFunction:
    Description: "Watchdog Lambda Function ARN"
    Value: !GetAtt WatchdogFunction.Arn
  WatchdogFunctionIamRole:
    Description: "Implicit IAM Role created for Watchdog function"
    Value: !GetAtt WatchdogFunctionRole.Arn
